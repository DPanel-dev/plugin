name: Mirror plugin repository to OCI registries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login docker.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Generate artifact tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/dpanel/plugin
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Archive DPanel plugin Git repository
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          : "${version:?Release tag must include a version after v}"
          commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          mkdir "$RUNNER_TEMP/plugin-image"
          git archive --format=tar --output="$RUNNER_TEMP/plugin-image/dpanel-plugin-git-snapshot.tar" "$commit"
          printf 'FROM scratch\nADD dpanel-plugin-git-snapshot.tar /\n' > "$RUNNER_TEMP/plugin-image/Dockerfile"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$commit" >> "$GITHUB_OUTPUT"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push repository mirror
        env:
          ARTIFACT_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_VERSION: ${{ steps.package.outputs.version }}
          IMAGE_RELEASE: ${{ steps.package.outputs.release }}
          IMAGE_CREATED_AT: ${{ steps.package.outputs.created_at }}
        run: |
          set -euo pipefail
          first_ref="${ARTIFACT_TAGS%%$'\n'*}"
          [ -n "$first_ref" ]
          # Keep legacy source/root labels until the store consumer accepts store.*.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --output type=image,oci-mediatypes=true,push=true \
            --annotation "manifest:com.dpanel.version=$IMAGE_VERSION" \
            --annotation "manifest:com.dpanel.release=$IMAGE_RELEASE" \
            --label "com.dpanel.version=$IMAGE_VERSION" \
            --label "com.dpanel.release=$IMAGE_RELEASE" \
            --label "com.dpanel.image.createdAt=$IMAGE_CREATED_AT" \
            --label com.dpanel.store.root=/ \
            --label "com.dpanel.store.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "com.dpanel.store.commit=$IMAGE_RELEASE" \
            --label "com.dpanel.plugin.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label com.dpanel.plugin.root=/ \
            --tag "$first_ref" \
            "$RUNNER_TEMP/plugin-image"
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if [ "$ref" != "$first_ref" ]; then
              # Copy the manifest directly so additional tags retain its annotations.
              docker buildx imagetools create --prefer-index=false --tag "$ref" "$first_ref"
            fi
          done <<< "$ARTIFACT_TAGS"

      - name: Sync images to Aliyun
        env:
          ARTIFACT_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          : "${REGISTRY_USERNAME:?Set ALIYUN_USERNAME}"
          : "${REGISTRY_PASSWORD:?Set ALIYUN_PASSWORD}"
          docker run --rm \
            -e ARTIFACT_TAGS -e REGISTRY_USERNAME -e REGISTRY_PASSWORD \
            -e HTTP_PROXY -e HTTPS_PROXY -e ALL_PROXY -e NO_PROXY \
            --entrypoint /bin/sh quay.io/skopeo/stable:latest -ec '
              set -eu
              printf %s "$REGISTRY_PASSWORD" | skopeo login \
                --username "$REGISTRY_USERNAME" --password-stdin registry.cn-hangzhou.aliyuncs.com
              for ref in $ARTIFACT_TAGS; do
                destination="registry.cn-hangzhou.aliyuncs.com/${ref#docker.io/}"
                echo "Sync $ref -> $destination"
                skopeo copy --all --preserve-digests --retry-times 3 \
                  "docker://$ref" "docker://$destination"
              done'
