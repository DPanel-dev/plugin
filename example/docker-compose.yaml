services:
  rclone:
    image: rclone/rclone:latest
    container_name: ${DP_PLUGIN_NAME}
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      - SYNC_PATH=${SYNC_PATH}
      - REMOTE=${RCLONE_REMOTE}
      - INTERVAL=${SYNC_INTERVAL}
      - DP_HOST_IP=${DP_PLUGIN_HOST_IP}
      - DP_NAME=${DP_PLUGIN_NAME}
    volumes:
      - "${SYNC_PATH}:/data"