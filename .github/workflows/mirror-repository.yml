name: Mirror plugin repository to OCI registries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login docker.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Generate artifact tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/dpanel/plugin
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Archive DPanel plugin Git repository
        run: |
          mkdir "$RUNNER_TEMP/plugin-image"
          git archive --format=tar --output="$RUNNER_TEMP/plugin-image/dpanel-plugin-git-snapshot.tar" "$GITHUB_SHA"
          printf 'FROM scratch\nADD dpanel-plugin-git-snapshot.tar /\n' > "$RUNNER_TEMP/plugin-image/Dockerfile"

      - name: Build and push repository mirror
        env:
          ARTIFACT_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_ref="${ARTIFACT_TAGS%%$'\n'*}"
          [ -n "$first_ref" ]
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "com.dpanel.plugin.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label com.dpanel.plugin.root=/ \
            --tag "$first_ref" \
            "$RUNNER_TEMP/plugin-image"
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if [ "$ref" != "$first_ref" ]; then
              docker tag "$first_ref" "$ref"
            fi
            docker push "$ref"
          done <<< "$ARTIFACT_TAGS"

      - name: Sync images to Aliyun
        env:
          ARTIFACT_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          : "${REGISTRY_USERNAME:?Set ALIYUN_USERNAME}"
          : "${REGISTRY_PASSWORD:?Set ALIYUN_PASSWORD}"
          docker run --rm \
            -e ARTIFACT_TAGS -e REGISTRY_USERNAME -e REGISTRY_PASSWORD \
            -e HTTP_PROXY -e HTTPS_PROXY -e ALL_PROXY -e NO_PROXY \
            --entrypoint /bin/sh quay.io/skopeo/stable:latest -ec '
              set -eu
              printf %s "$REGISTRY_PASSWORD" | skopeo login \
                --username "$REGISTRY_USERNAME" --password-stdin registry.cn-hangzhou.aliyuncs.com
              for ref in $ARTIFACT_TAGS; do
                destination="registry.cn-hangzhou.aliyuncs.com/${ref#docker.io/}"
                echo "Sync $ref -> $destination"
                skopeo copy --all --preserve-digests --retry-times 3 \
                  "docker://$ref" "docker://$destination"
              done'
